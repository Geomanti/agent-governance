name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Unit tests
        run: pytest tests/ -q

      - name: Eval gate (blocks on regression)
        run: python -m agent_governance.evals.runner

      - name: Forbidden-path audit must stay closed
        run: |
          python - <<'PY'
          import sys
          from agent_governance.evals.mutants import audit_forbidden_paths, score_mutation
          from agent_governance.server import REGISTRY

          a = audit_forbidden_paths(REGISTRY)
          print(a.verdict)
          if not a.ok:
              print("FAIL: the commitment-write class is reachable", file=sys.stderr)
              sys.exit(1)

          ms = score_mutation()
          print(ms.summary())
          if ms.score < 1.0:
              print(f"FAIL: survivors {[s.mutant for s in ms.survivors]}", file=sys.stderr)
              sys.exit(1)
          PY
